<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی ریاضی</title>
</head>
<body>
    <h1>بازی ریاضی</h1>
    <input type="text" id="name" placeholder="نام دانش‌آموز">
    <input type="number" id="score" placeholder="امتیاز">
    <button onclick="saveData()">ثبت امتیاز</button>

    <script>
        const API_URL = "لینک-API-خود-را-اینجا-بگذار"; // لینک را از SheetDB بگیر و اینجا بگذار

        async function saveData() {
            const name = document.getElementById('name').value;
            const score = document.getElementById('score').value;

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    data: {
                        student_name: name,
                        score: score,
                        duration: "0", 
                        created_at: new Date().toISOString()
                    }
                })
            });
            alert("امتیاز با موفقیت ثبت شد!");
        }
    </script>
</body>
</html>
