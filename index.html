<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی ریاضی</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; margin-top: 50px; }
        #question { font-size: 24px; margin: 20px; }
    </style>
</head>
<body>
    <h1>بازی ریاضی</h1>
    <div id="game-container">
        <div id="question"></div>
        <input type="number" id="answer" placeholder="پاسخ">
        <button onclick="checkAnswer()">ثبت پاسخ</button>
    </div>
    <hr>
    <h3>ثبت امتیاز</h3>
    <input type="text" id="student_name" placeholder="نام دانش‌آموز">
    <input type="number" id="score" placeholder="امتیاز">
    <button onclick="saveScore()">ذخیره در دیتابیس</button>

    <script>
        // تولید سوال تصادفی
        let num1 = Math.floor(Math.random() * 10) + 1;
        let num2 = Math.floor(Math.random() * 10) + 1;
        document.getElementById('question').innerText = num1 + " + " + num2 + " = ؟";

        function checkAnswer() {
            let userAns = document.getElementById('answer').value;
            if(parseInt(userAns) === (num1 + num2)) {
                alert("آفرین! درست بود.");
                document.getElementById('score').value = 20; // فرض بر ۲۰ امتیاز
            } else {
                alert("اشتباه بود، دوباره تلاش کن.");
            }
        }

        function saveScore() {
            const name = document.getElementById('student_name').value;
            const score = document.getElementById('score').value;
            const api_url = 'https://sheetdb.io/api/v1/1rimik9r6h8ti'; 

            fetch(api_url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    data: [{'student_name': name, 'score': score, 'created_at': new Date().toLocaleString('fa-IR')}]
                })
            }).then(() => alert('امتیاز ثبت شد!'));
        }
    </script>
</body>
</html>
