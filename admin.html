<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل مدیریت</title>
</head>
<body>
    <h1>لیست امتیازات</h1>
    <div id="results">در حال بارگذاری...</div>

    <script>
        const API_URL = https://sheetdb.io/api/v1/1rimik9r6h8ti

        async function loadData() {
            const response = await fetch(API_URL);
            const data = await response.json();
            let html = "<table border='1'><tr><th>نام</th><th>امتیاز</th></tr>";
            data.forEach(row => {
                html += `<tr><td>${row.student_name}</td><td>${row.score}</td></tr>`;
            });
            html += "</table>";
            document.getElementById('results').innerHTML = html;
        }
        loadData();
    </script>
</body>
</html>
